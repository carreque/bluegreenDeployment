# Pre-merge validation.
#
# GitHub's role in this design is source-only: CodeConnections grants
# CodePipeline read access and a push to main triggers a deployment. This
# workflow deploys nothing and needs no AWS credentials and no OIDC federation
# — it lints and tests source, builds the container image and smoke-tests it,
# and touches nothing in the account.
#
# It exists because pull requests do not trigger the pipelines (roadmap §2.1),
# only the merge does. Without it the pre-merge gate would be the honour system.
name: pr-validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    # The contract suite runs against DynamoDB Local. A service container is
    # the GitHub-native equivalent of `make local-up`.
    #
    # No `command:` override, deliberately — service containers cannot set one,
    # and this image's default entrypoint is already
    # `java -jar DynamoDBLocal.jar -inMemory` on port 8000. The compose file
    # adds -sharedDb for local work so the AWS CLI and the app agree; here every
    # client is the test suite presenting the same credentials and region, so
    # there is nothing to share across.
    services:
      dynamodb-local:
        image: public.ecr.aws/aws-dynamodb-local/aws-dynamodb-local@sha256:ff89bd48ff32cd8d9be5fee8873b65b8854dc408f1afe881be6eb00247bc0dab
        ports:
          - 8000:8000

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # The repository pin, so CI and this machine cannot disagree.
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: app/requirements-dev.txt

      - name: Install hash-pinned dependencies
        run: pip install --require-hashes -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format check
        run: ruff format --check .

      - name: Tests with coverage
        run: pytest

  image:
    # arm64, because the image targets linux/arm64 (Phase 2 §D1) and Fargate
    # runs it on Graviton. An x86 runner would have to emulate, which measures
    # the emulator as much as the Dockerfile.
    #
    # ubuntu-24.04-arm is free on public repositories and billed on private
    # ones. If this repository is private and that is unwanted, delete this job
    # — `make build` and `make image-verify` still prove the same things
    # locally, and Phase 8's CodeBuild proves them again on every merge.
    runs-on: ubuntu-24.04-arm

    services:
      dynamodb-local:
        image: public.ecr.aws/aws-dynamodb-local/aws-dynamodb-local@sha256:ff89bd48ff32cd8d9be5fee8873b65b8854dc408f1afe881be6eb00247bc0dab
        ports:
          - 8000:8000

    steps:
      # The build reads the commit timestamp and the short SHA, both of which
      # actions/checkout provides at its default depth.
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: app/requirements-dev.txt

      - name: Install hash-pinned dependencies
        working-directory: app
        run: pip install --require-hashes -r requirements-dev.txt

      # BGD_DYNAMODB_ENDPOINT_URL is mandatory, not defensive: create_tables
      # exits with an error when it is unset, deliberately, so that a stray
      # AWS_PROFILE cannot point it at a real account. Locally the value comes
      # from app/.env, which is gitignored and therefore absent on the runner.
      - name: Create the DynamoDB tables
        working-directory: app
        env:
          PYTHONPATH: src
          BGD_DYNAMODB_ENDPOINT_URL: http://localhost:8000
        run: python -m bgd.cli.create_tables

      - name: Build the image
        run: ./scripts/build-image.sh

      # Not `make image-test`: its build and local-tables prerequisites are
      # separate, individually-reported steps here, and local-tables would try
      # to start a compose container the runner already provides as a service.
      - name: Image suite
        working-directory: app
        run: pytest -m image --no-cov

      - name: Generate the SBOM
        run: ./scripts/generate-sbom.sh

      - name: Publish the SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: app/dist/sbom.spdx.json
